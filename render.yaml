# Free hosting on Render (no card, no PC): docs/handover/FREE_SERVER.md.
# One Blueprint makes three things: a free PostgreSQL database, the API (Docker, free plan) and
# the web app (static site). The web app forwards /api/* to the API, so the browser sees one
# address and the session cookie stays first-party. Secrets are generated by Render or typed in
# the dashboard; none are in this file.
databases:
  - name: decisionguard-db
    plan: free
    region: singapore
    databaseName: decisionguard
    user: decisionguard

services:
  - type: web
    name: decisionguard-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infra/Dockerfile.api
    dockerContext: .
    # Load the synthetic demo shops (idempotent), then serve on Render's port. Render runs this
    # through a shell itself, so it stays a plain path with no quotes.
    dockerCommand: sh bin/start-hosted.sh
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: demo
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: decisionguard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: VAULT_KEY
        generateValue: true
      # Real anchoring on the Ethereum Sepolia testnet. With no SEPOLIA_PRIVATE_KEY (or if the
      # testnet fails) every anchor is made offline instead and labelled offline.
      - key: CHAIN_MODE
        value: sepolia
      - key: SEPOLIA_RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: SEPOLIA_PRIVATE_KEY
        sync: false
      # fixtures: recorded answers, no model calls. Set to live and fill the two keys in the
      # dashboard (Environment tab) to use real models.
      - key: LLM_MODE
        value: fixtures
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # The web app's address. Change it in the dashboard if Render gave the site another name.
      - key: CORS_ORIGINS
        value: https://decisionguard-web.onrender.com

  - type: web
    name: decisionguard-web
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    autoDeploy: false
    routes:
      # Change the host if Render gave the API another name.
      - type: rewrite
        source: /api/*
        destination: https://decisionguard-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
