    evidence_quote: "Bangladesh Bank has capped the maximum interest rate at 7% for loans under a Tk20,000 crore pre-financing scheme"
    notes: "News source (Sep 2026). 7% includes all charges; six-month grace. For closed industries; CMSME eligibility unclear."

  - id: bd-pksf-microenterprise
    provider: "Palli Karma-Sahayak Foundation (via partner MFIs)"
