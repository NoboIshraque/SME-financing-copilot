    evidence_quote: "a maximum of 4%, applied on a quarterly compounding basis"
    notes: "News source (FE, 9 Jul 2025); Prime Bank's Sep 2026 rate sheet lists 4.00%. Business registered for at most 12 years; quarterly compounding approximated as reducing balance."

  - id: bd-bb-closed-industry-prefinance
