    notes: "PKSF publishes no rate; the Microcredit Regulatory Authority cap of 24% is used (bdnews24, 13 Oct 2026: 'the maximum microcredit service charge was set at 24 percent'). Declining-balance basis assumed (not confirmed from a primary MRA source)."

