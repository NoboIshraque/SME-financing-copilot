name: E2E

# Playwright journeys (WP-15), desktop and phone. The local target boots the dev stack on the
# runner (API + web in API mode "auto": routers that have not landed yet are answered by the
# labelled offline mock). Runs on PRs that touch the app, and on demand.
on:
  pull_request:
    paths:
      - "web/**"
      - "backend/app/**"
      - "data/synthetic/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local:
    name: Playwright (local target)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install
        run: |
          npm ci
          uv --directory backend sync --frozen
          npm --prefix web ci
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Journeys (starts `npm run dev`)
        working-directory: web
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-local
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
